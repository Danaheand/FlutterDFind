name: Dfind
description: A Flutter app for managing inventory with a modular structure.
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.1.1
  crypto: ^3.0.2
  flutter_colorpicker: ^1.0.3
  image_picker: ^1.1.2 
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  http: ^1.1.0
  confetti: ^0.7.0
  connectivity_plus: ^6.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/avatars/